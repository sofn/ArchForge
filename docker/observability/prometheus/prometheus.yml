global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: archforge
    replica: '0'

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ 'alertmanager:9093' ]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'archforge'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'archforge:8080'
          - 'backend:8080'
    scrape_interval: 15s

  - job_name: 'archforge-host'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]
        labels:
          env: 'dev'
    scrape_interval: 15s

  - job_name: 'jaeger'
    static_configs:
      - targets: [ 'jaeger:16686' ]
    metrics_path: '/metrics'
