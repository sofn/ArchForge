# docker-compose.yml — Default: jlink mode (minimal JRE + Project Leyden CDS)
# Usage: docker compose up -d
# For other modes: docker compose -f docker-compose.<mode>.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-archforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-archforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  archforge:
    image: archforge:jlink
    build:
      context: ..
      dockerfile: docker/jlink/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DB_USER_MASTER_URL: jdbc:postgresql://postgres:5432/archforge_user
      DB_USER_SLAVE_URL: jdbc:postgresql://postgres:5432/archforge_user
      DB_TASK_MASTER_URL: jdbc:postgresql://postgres:5432/archforge_task
      DB_TASK_SLAVE_URL: jdbc:postgresql://postgres:5432/archforge_task
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_USER_MASTER_USERNAME: ${DB_USERNAME:-archforge}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_USER_MASTER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_USER_SLAVE_USERNAME: ${DB_USERNAME:-archforge}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_USER_SLAVE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_TASK_MASTER_USERNAME: ${DB_USERNAME:-archforge}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_TASK_MASTER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_TASK_SLAVE_USERNAME: ${DB_USERNAME:-archforge}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_TASK_SLAVE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_USER_MASTER_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_USER_SLAVE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_TASK_MASTER_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_TASK_SLAVE_DRIVER_CLASS_NAME: org.postgresql.Driver
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SAMPLING_PROBABILITY: "0.1"
    volumes:
      - ./logs:/app/logs
    networks:
      - default
      - observability

volumes:
  postgres-data:

networks:
  observability:
    name: archforge-observability
    external: true
