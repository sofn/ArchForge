# docker-compose.staging.yml — Staging environment (full JRE, single node)
# Usage: cd scripts/staging && cp .env.example .env && ./deploy.sh

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-archforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-archforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: archforge:fulljre
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      REDIS_HOST: redis
      DB_USER_MASTER_URL: jdbc:postgresql://postgres:5432/archforge_user
      DB_USER_SLAVE_URL: jdbc:postgresql://postgres:5432/archforge_user
      DB_TASK_MASTER_URL: jdbc:postgresql://postgres:5432/archforge_task
      DB_TASK_SLAVE_URL: jdbc:postgresql://postgres:5432/archforge_task
      DB_USERNAME: ${DB_USERNAME:-archforge}
      DB_PASSWORD: ${DB_PASSWORD:-archforge}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-archforge}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SAMPLING_PROBABILITY: "0.1"
    volumes:
      - ./logs:/app/logs
    networks:
      - default
      - observability

  frontend:
    image: archforge-frontend:latest
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:

networks:
  observability:
    name: archforge-observability
    external: true
