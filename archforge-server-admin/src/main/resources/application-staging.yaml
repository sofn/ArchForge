# Staging environment
server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  datasource:
    dynamic:
      druid:
        filters: stat
      datasource:
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_MASTER_URL:jdbc:postgresql://postgres:5432/archforge}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}
        # Optional read-replica — uncomment to enable master/slave routing.
        # primary stays `master`; @DS("slave") routes reads once present.
        # slave:
        #   type: com.alibaba.druid.pool.DruidDataSource
        #   driver-class-name: org.postgresql.Driver
        #   url: ${DB_SLAVE_URL:jdbc:postgresql://postgres:5432/archforge}
        #   username: ${DB_USERNAME:archforge}
        #   password: ${DB_PASSWORD:archforge}

management:
  tracing:
    enabled: true
    sampling:
      probability: ${SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

arch-forge:
  # Flyway 由 common.persistence.FlywayConfig 装配并消费本段配置（spring.flyway.* 在本项目无自动配置可消费）。
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"
    locations: classpath:db/migration
    default-schema: public
  monitor:
    enabled: true
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: 604800
  captcha:
    enabled: true
  file-storage:
    type: ${FILE_STORAGE_TYPE:s3}
    local-dir: uploads
    s3:
      endpoint: ${S3_ENDPOINT:http://minio:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:archforge}
