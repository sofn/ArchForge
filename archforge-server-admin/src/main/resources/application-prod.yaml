# Production environment
server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  quartz:
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: public
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 16
          max-wait: 1s
  datasource:
    dynamic:
      druid:
        filters: stat
        initial-size: 2
        max-active: 20
        min-idle: 2
        max-wait: 60000
      datasource:
        user_master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_MASTER_URL:jdbc:postgresql://postgres:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD}
        user_slave:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_SLAVE_URL:jdbc:postgresql://postgres:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD}
        task_master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_TASK_MASTER_URL:jdbc:postgresql://postgres:5432/archforge_task}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD}
        task_slave:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_TASK_SLAVE_URL:jdbc:postgresql://postgres:5432/archforge_task}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD}

management:
  tracing:
    enabled: true
    sampling:
      probability: ${SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

arch-forge:
  embedded:
    redis: false
    postgresql: false
    db-init: false
    s3: false
  flyway:
    enabled: true
  monitor:
    enabled: true
  web:
    public-url: ${WEB_PUBLIC_URL}
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: 604800
  captcha:
    enabled: true
  file-storage:
    type: ${FILE_STORAGE_TYPE:s3}
    local-dir: uploads
    s3:
      endpoint: ${S3_ENDPOINT}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
