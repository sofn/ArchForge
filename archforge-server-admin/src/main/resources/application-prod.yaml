# Production environment
server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 16
          max-wait: 1s
  datasource:
    dynamic:
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: ${DB_MASTER_URL:jdbc:postgresql://postgres:5432/archforge}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD}
        # Optional read-replica — uncomment to enable master/slave routing.
        # primary stays `master`; @DS("slave") routes reads once present.
        # slave:
        #   driver-class-name: org.postgresql.Driver
        #   url: ${DB_SLAVE_URL:jdbc:postgresql://postgres:5432/archforge}
        #   username: ${DB_USERNAME:archforge}
        #   password: ${DB_PASSWORD}

management:
  tracing:
    enabled: true
    sampling:
      probability: ${SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  server:
    # 指标/健康放在独立管理端口：它不发布到宿主机，也不经前端 nginx 的 /api 代理，
    # 公网拿不到 /actuator/prometheus；编排器探针用业务端口上的 /livez /readyz
    port: ${MANAGEMENT_SERVER_PORT:8089}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

arch-forge:
  # 请求/响应体里有会话 token 与 PII：非 dev 环境不落盘载荷（只保留 api/method/状态/耗时）；排障需要时用环境变量临时打开
  request-log:
    include-request-payload: false
    include-response-payload: false
  rsa-private-key: ${ARCH_FORGE_RSA_PRIVATE_KEY}
  # Flyway 由 common.persistence.FlywayConfig 装配并消费本段配置（spring.flyway.* 在本项目无自动配置可消费）。
  flyway:
    enabled: true
    baseline-on-migrate: true
    # V4.1/V5 (pre-db-scheduler) were removed from the repository; legacy databases that already
    # applied them report them as missing — tolerated, and V23 prunes the stale history rows.
    ignore-migration-patterns: "*:missing"
    locations: classpath:db/migration/__root
    default-schema: public
  monitor:
    enabled: true
  web:
    public-url: ${WEB_PUBLIC_URL}
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: 604800
  llm:
    provider: ${LLM_PROVIDER:openai}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
  captcha:
    enabled: true
  file-storage:
    type: ${FILE_STORAGE_TYPE:s3}
    local-dir: uploads
    s3:
      endpoint: ${S3_ENDPOINT}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
