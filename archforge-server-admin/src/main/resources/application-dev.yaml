# Development environment
server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  port: 8080

spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      exclude: "static/**,public/**"
    livereload:
      enabled: true
      port: 35729
  # Dev: local Docker containers started by scripts/dev/init.sh
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # Database - PostgreSQL via local Docker containers (script-initialized)
  datasource:
    dynamic:
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: ${DB_MASTER_URL:jdbc:postgresql://localhost:5432/archforge}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:}
        # Optional read-replica — uncomment to enable master/slave routing.
        # primary stays `master`; @DS("slave") routes reads once present.
        # slave:
        #   driver-class-name: org.postgresql.Driver
        #   url: ${DB_SLAVE_URL:jdbc:postgresql://localhost:5432/archforge}
        #   username: ${DB_USERNAME:archforge}
        #   password: ${DB_PASSWORD:}

# OpenTelemetry (tracing endpoint configured via OTEL_EXPORTER_OTLP_ENDPOINT env var; sampling via SAMPLING_PROBABILITY)
management:
  tracing:
    enabled: true
    sampling:
      probability: ${SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

arch-forge:
  flyway:
    enabled: true
  monitor:
    enabled: true
  web:
    public-url: http://localhost:8081
  jwt:
    secret: ${JWT_SECRET:}
    expire-seconds: 604800
  captcha:
    enabled: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8848
      - http://localhost:3000
  llm:
    provider: ${LLM_PROVIDER:openai}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    anthropic-version: ${LLM_ANTHROPIC_VERSION:2023-06-01}
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-dir: uploads
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:archforge}
