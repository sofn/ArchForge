# Fail rules whose should-clause receives no classes (prevents always-passing rules
# when a package filter has a typo). This is the ArchUnit default; kept explicit.
archRule.failOnEmptyShould=true
# FreezingArchRule store: committed violations baseline. Refreeze with
# -Darchunit.freeze.refreeze=true then commit the changed files.
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false
