# Development environment
server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      exclude: "static/**,public/**"
    livereload:
      enabled: true
      port: 35729
  # Dev: local Docker containers started by scripts/dev/init.sh
  quartz:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # Database - PostgreSQL via local Docker containers (script-initialized)
  datasource:
    dynamic:
      druid:
        filters: stat
      datasource:
        user_master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_MASTER_URL:jdbc:postgresql://localhost:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}
        user_slave:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_SLAVE_URL:jdbc:postgresql://localhost:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}
        task_master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_TASK_MASTER_URL:jdbc:postgresql://localhost:5432/archforge_task}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}
        task_slave:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_TASK_SLAVE_URL:jdbc:postgresql://localhost:5432/archforge_task}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}

# OpenTelemetry (tracing endpoint configured via OTEL_EXPORTER_OTLP_ENDPOINT env var; sampling via SAMPLING_PROBABILITY)
management:
  tracing:
    enabled: true
    sampling:
      probability: ${SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

arch-forge:
  druid:
    login-username: admin
    login-password: admin
  embedded:
    redis: false
    postgresql: false
    db-init: false
    s3: false
  flyway:
    enabled: false
  monitor:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:5/jDAWs7a63GRgjS+uF2mP7dcLwI6GAgxf+Z0+fOAbgMR/jksG5r0v10nDOkrM0btxtb2FAuol8fSzSJis8gIA==}
    expire-seconds: 604800
  captcha:
    enabled: false
  file-storage:
    type: ${FILE_STORAGE_TYPE:s3}
    local-dir: uploads
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:archforge}
