# Test environment: Testcontainers + isolated runtime
server:
  port: 0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  # 数据源连接信息由 AbstractIntegrationTest 经 @DynamicPropertySource 注入（user_master/user_slave）；
  # 这里只需声明分组骨架 —— 主 application.yaml 不含 datasource 块（dev/prod 各自完整声明）。
  datasource:
    dynamic:
      primary: user_master
      strict: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info

arch-forge:
  # 依赖服务（PostgreSQL / Redis）由 common-jpa testFixtures 的 testsupport.AbstractIntegrationTest 提供；
  # schema 由 Flyway 迁移建立（migrations 在 common-jpa classpath 上）。
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: public
  jwt:
    secret: ${JWT_SECRET:test-jwt-secret-for-integration-only}
  token:
    secret: ${JWT_SECRET:test-jwt-secret-for-integration-only}
  mock-auth:
    enabled: true
  file-storage:
    type: local
    local-dir: ../uploads
  register:
    enabled: true
  verification-code:
    expire-seconds: 300
    resend-seconds: 60
    daily-max-per-email: 20
  mail:
    enabled: false
    from: no-reply@archforge.com
    verification-subject: 您的验证码
