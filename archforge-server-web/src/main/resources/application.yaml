server:
  servlet:
    context-path: /

spring:
  application:
    name: server-web
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.servlet.ManagementWebSecurityAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # /livez 与 /readyz 同时挂在业务端口上：prod 把 actuator 挪去独立管理端口后，编排器仍有探针可用
        add-additional-paths: true
      group:
        # liveness 只看进程本身：Redis/DB 抖动不能让编排器把实例重启
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false

arch-forge:
  mock-auth:
    enabled: false
  idempotent:
    base-path: /web/idempotent
