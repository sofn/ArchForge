# Development environment
server:
  port: 8081

spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    dynamic:
      primary: user_master
      strict: false
      datasource:
        user_master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_MASTER_URL:jdbc:postgresql://localhost:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}
        user_slave:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_SLAVE_URL:jdbc:postgresql://localhost:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

arch-forge:
  # 与 server-admin 共享 archforge_user 库；schema 由 Flyway 迁移（common.persistence.FlywayConfig）独占管理
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: public
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-dir: ${FILE_STORAGE_LOCAL_DIR:../uploads}
  register:
    enabled: true
  verification-code:
    expire-seconds: 300
    resend-seconds: 60
    daily-max-per-email: 20
  mail:
    enabled: false
    from: no-reply@archforge.com
    verification-subject: 您的验证码
