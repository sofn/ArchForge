# Production environment
server:
  port: 8081

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: ${DB_MASTER_URL}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
        # Optional read-replica — uncomment to enable master/slave routing.
        # primary stays `master`; @DS("slave") routes reads once present.
        # slave:
        #   driver-class-name: org.postgresql.Driver
        #   url: ${DB_SLAVE_URL}
        #   username: ${DB_USERNAME}
        #   password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 16
          max-wait: 1s

management:
  server:
    # 指标/健康放在独立管理端口：它不发布到宿主机，也不经前端 nginx 的 /api 代理，
    # 公网拿不到 /actuator/prometheus；编排器探针用业务端口上的 /livez /readyz
    port: ${MANAGEMENT_SERVER_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

arch-forge:
  # 请求/响应体里有会话 token 与 PII：非 dev 环境不落盘载荷（只保留 api/method/状态/耗时）；排障需要时用环境变量临时打开
  request-log:
    include-request-payload: false
    include-response-payload: false
  # 与 server-admin 共享 archforge 库与 flyway_schema_history；双写安全（DB 锁串行化）
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"
    locations: classpath:db/migration/__root
    default-schema: public
  file-storage:
    type: ${FILE_STORAGE_TYPE:s3}
    local-dir: ${FILE_STORAGE_LOCAL_DIR:../uploads}
    s3:
      endpoint: ${S3_ENDPOINT}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  token:
    header: Authorization
