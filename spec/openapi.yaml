openapi: "3.1.0"
info:
  title: "标题：ArchForge接口文档"
  description: "描述：文档说明"
  contact:
    name: "ArchForge"
  version: "版本号:1.0.0"
servers:
- url: "/"
security:
- bearer: []
tags:
- name: "定时任务管理"
  description: "db-scheduler 反射调度任务管理"
- name: "文件管理"
  description: "文件上传、下载、删除接口"
- name: "用户导出"
  description: "FastExcel 用户导出接口"
- name: "登录API"
  description: "登录相关接口"
paths:
  /admin/chat/config:
    get:
      tags:
      - "ChatAI"
      summary: "LLM 配置状态（不含密钥）"
      operationId: "config"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties:
                  type: "object"
  /admin/chat/sessions:
    get:
      tags:
      - "ChatAI"
      summary: "会话列表"
      operationId: "sessions"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  additionalProperties:
                    type: "object"
    post:
      tags:
      - "ChatAI"
      summary: "新建会话"
      operationId: "createSession"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties:
                  type: "object"
  /admin/chat/sessions/{id}:
    delete:
      tags:
      - "ChatAI"
      summary: "删除会话"
      operationId: "delete_4"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
  /admin/chat/sessions/{id}/messages:
    get:
      tags:
      - "ChatAI"
      summary: "会话消息"
      operationId: "messages"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  additionalProperties:
                    type: "string"
    post:
      tags:
      - "ChatAI"
      summary: "发送消息（SSE：delta / done / error）"
      operationId: "send"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
  /admin/config:
    post:
      tags:
      - "参数管理"
      summary: "获取参数列表"
      operationId: "getConfigList"
      requestBody:
        content:
          application/json:
            schema:
