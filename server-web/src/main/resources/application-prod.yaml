# Production environment
server:
  port: 8081

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    dynamic:
      primary: user_master
      strict: false
      datasource:
        user_master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_MASTER_URL}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
        user_slave:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_SLAVE_URL}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

arch-forge:
  embedded:
    redis: false
    postgresql: false
    db-init: false
    s3: false
  file-storage:
    type: ${FILE_STORAGE_TYPE:s3}
    local-dir: ${FILE_STORAGE_LOCAL_DIR:../uploads}
    s3:
      endpoint: ${S3_ENDPOINT}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET}
  jwt:
    secret: ${JWT_SECRET}
  token:
    header: Authorization
    secret: ${JWT_SECRET}
