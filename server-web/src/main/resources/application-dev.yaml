# Development environment
server:
  port: 8081

spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    dynamic:
      primary: user_master
      strict: false
      datasource:
        user_master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_MASTER_URL:jdbc:postgresql://localhost:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}
        user_slave:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: org.postgresql.Driver
          url: ${DB_USER_SLAVE_URL:jdbc:postgresql://localhost:5432/archforge_user}
          username: ${DB_USERNAME:archforge}
          password: ${DB_PASSWORD:archforge}

arch-forge:
  embedded:
    redis: false
    postgresql: false
    db-init: false
    s3: false
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-dir: ${FILE_STORAGE_LOCAL_DIR:../uploads}
